{% extends "mainapp/base.html" %}
{% block title %}Edit {{ image.title }}{% endblock %}
{% block heading %}Edit: {{ image.title }}{% endblock %}
{% block nav %}
    <a href="{% url 'image_detail' image.pk %}">Details</a>
{% endblock %}
{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit">Save</button>
    </form>
    <form method="post" action="{% url 'delete_image' image.pk %}" onsubmit="return confirm('Delete this image?')">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>
{% endblock %}
